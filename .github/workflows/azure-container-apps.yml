# Build and deploy AuraCode to Azure Container Apps on push to main.
# Required GitHub secrets / variables:
#   AZURE_CREDENTIALS          — az ad sp create-for-rbac JSON
#   ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD
#   RESOURCE_GROUP, BACKEND_APP, FRONTEND_APP
#   NEXT_PUBLIC_API_BASE_URL   — backend FQDN URL (https://...)

name: Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push backend
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker build backend
        run: |
          docker build -f Dockerfile.backend -t ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }} -t ${{ secrets.ACR_LOGIN_SERVER }}/backend:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backend:latest

      - name: Docker build frontend
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest \
            frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest

      - name: Deploy Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update -g ${{ secrets.RESOURCE_GROUP }} -n ${{ secrets.BACKEND_APP }} --image ${{ secrets.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
            az containerapp update -g ${{ secrets.RESOURCE_GROUP }} -n ${{ secrets.FRONTEND_APP }} --image ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
