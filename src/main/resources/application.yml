spring:
  application:
    name: lovable-clone

  datasource:
    url: jdbc:postgresql://localhost:9000/testDB
    username: testUser
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret-key: ${JWT_SECRET_KEY:development-only-replace-with-long-random-secret-min-32-chars}

stripe:
  api:
    secret: ${STRIPE_API_SECRET:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}

client:
  url: ${CLIENT_URL:http://localhost:8080}
