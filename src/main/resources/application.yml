spring:
  application:
    name: lovable-clone

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:9010/pgvector-test}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    # Existing databases (created by the old ddl-auto: update) are baselined at version 1,
    # so V1__baseline.sql is skipped there; fresh/empty databases execute it.
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          # Generation quality is capped by this model. gpt-4.1-mini is the cost/quality
          # sweet spot (~$0.05 per full app generation); set OPENAI_MODEL=gpt-4.1 for
          # higher quality at ~4x the cost. Avoid gpt-5/o-series here: they reject
          # max_tokens/temperature params as configured below.
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          # 0.0 produces the most conservative, generic UI code; ~0.7 is the sweet spot for design work.
          temperature: ${OPENAI_TEMPERATURE:0.7}
          # Multi-screen apps stream 15-30k output tokens; without this the provider
          # default can truncate the response mid-file.
          max-tokens: ${OPENAI_MAX_TOKENS:20000}
          # OpenAI omits usage stats from streamed responses unless asked; without this
          # recordTokenUsage() always receives nothing and daily limits are never enforced.
          stream-usage: true

jwt:
  secret-key: ${JWT_SECRET_KEY}
  # There is no refresh-token flow; a short expiry logs users out mid-session
  # (10 min caused constant "JWT expired" failures). 12h is a dev-friendly default.
  access-token-validity-minutes: ${JWT_VALIDITY_MINUTES:720}

stripe:
  api:
    secret: ${STRIPE_API_KEY:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}

cashfree:
  app-id: ${CASHFREE_APP_ID:}
  secret-key: ${CASHFREE_SECRET_KEY:}
  # SANDBOX or PRODUCTION
  env: ${CASHFREE_ENV:PRODUCTION}
  # Optional public webhook URL (also configure in Cashfree Dashboard → Webhooks)
  notify-url: ${CASHFREE_NOTIFY_URL:}

# First startup with an empty DB: seeds one plan (id 1) when Stripe price and/or INR amount is set.
billing:
  default-plan:
    name: Pro
    stripe-price-id: ${STRIPE_DEFAULT_PRICE_ID:}
    amount-inr: ${CASHFREE_DEFAULT_AMOUNT_INR:699}

# The Next.js frontend origin (dev server runs `next dev -p 5173`); Stripe/Cashfree
# checkout redirects back to {client.url}/billing?status=... after payment.
client.url: ${CLIENT_URL:http://localhost:5173}

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

# S3 API endpoint only (no bucket path). "unexpected end of stream" = wrong port or service not MinIO.
# API is usually port 9000 inside the container; Docker may publish it as 9002 on the host—use that in minio.url.
# Console UI is a different port (often 9001)—do not use that as minio.url.
# When MinIO is unreachable, files still save in Postgres (project_files.content).
minio:
  url: ${MINIO_URL:http://127.0.0.1:9002}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  project-bucket: ${MINIO_PROJECT_BUCKET:projects}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

